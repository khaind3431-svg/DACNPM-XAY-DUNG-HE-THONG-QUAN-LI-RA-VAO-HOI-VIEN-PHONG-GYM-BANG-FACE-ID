server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/titanfit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

app:
  jwt:
    secret: TitanFitBiometricsSecretKeyForJWT2026MustBeAtLeast256BitsLong!!
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  gym:
    capacity: 80
    face-similarity-threshold: 86.0
    liveness-threshold: 80.0
    reference-date: "2026-10-17"

version: '3.8'

services:
  # -----------------------------------------------------
  # 1. Cơ sở dữ liệu MySQL 8.0
  # -----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: titanfit-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: titanfit_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - titanfit-net

  # -----------------------------------------------------
  # 2. Backend Spring Boot 3
  # -----------------------------------------------------
  backend:
    build:
      context: ./titanfit-backend
      dockerfile: Dockerfile
    container_name: titanfit-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/titanfit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - titanfit-net

  # -----------------------------------------------------
  # 3. Frontend React 19 + Nginx
  # -----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titanfit-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - titanfit-net

# -------------------------------------------------------
# Volumes & Networks
# -------------------------------------------------------
volumes:
  mysql_data:
    driver: local

networks:
  titanfit-net:
    driver: bridge
